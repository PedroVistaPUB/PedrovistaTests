  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 block;\">\n    <div style=\"display: flex; align-items: center; gap: clamp(12px, 3vw, 34px);\">\n      <a href=\"#linha\" style=\"display: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.6);\" style-hover=\"color: #ffffff;\">A linha<\u002Fa>\n      <a href=\"{{ whatsappUrl }}\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 22px; border-radius: 4px; background: #22DFFF; color: #050506; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; transition: box-shadow .3s, transform .3s;\" style-hover=\"box-shadow: 0 0 34px rgba(34,223,255,.5); transform: translateY(-1px);\">\n        Entrar no grupo\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"position: relative; min-height: 100svh; display: grid; grid-template-rows: 1fr auto; padding: 128px clamp(16px, 4vw, 64px) 34px;\">\n    <div style=\"display: grid; align-content: center; gap: clamp(22px, 3vw, 34px); max-width: 1500px; margin: 0 auto; width: 100%;\">\n      <div style=\"display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #FF7A2F;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #FF7A2F; box-shadow: 0 0 12px #FF7A2F;\"><\u002Fspan>\n        Série de lançamento · 150 unidades numeradas\n      <\u002Fdiv>\n\n      <h1 style=\"margin: 0; font-size: clamp(52px, 13vw, 210px); line-height: .82; font-weight: 900; letter-spacing: -.05em; text-transform: uppercase;\">\n        <span class=\"clip\" style=\"display: block;\">Uma nova<\u002Fspan>\n        <span class=\"clip\" style=\"display: block; color: #22DFFF; text-shadow: 0 0 60px rgba(34,223,255,.45);\">onda está<\u002Fspan>\n        <span class=\"clip\" style=\"display: block;\">chegando<\u002Fspan>\n      <\u002Fh1>\n\n      <div style=\"display: grid; gap: clamp(20px, 3vw, 48px); grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: end; border-top: 1px solid rgba(255,255,255,.14); padding-top: clamp(20px, 3vw, 30px);\">\n        <p class=\"rv\" style=\"margin: 0; max-width: 46ch; font-size: clamp(16px, 1.7vw, 20px); line-height: 1.5; color: rgba(255,255,255,.68); text-wrap: pretty;\">\n          Domene Spectrum. O DNA sonoro de um mestre brasileiro, agora ao alcance de quem vive da música. Série limitada a 150 unidades — e a venda acontece só no grupo.\n        <\u002Fp>\n        <div class=\"rv\" style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-self: end;\">\n          <a href=\"{{ whatsappUrl }}\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 58px; padding: 0 36px; border-radius: 4px; background: #22DFFF; color: #050506; font-size: 14px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; transition: box-shadow .3s, transform .3s;\" style-hover=\"box-shadow: 0 0 48px rgba(34,223,255,.5); transform: translateY(-2px);\">\n            Garantir minha vaga\n          <\u002Fa>\n          <a href=\"#linha\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 58px; padding: 0 30px; border-radius: 4px; border: 1px solid rgba(255,255,255,.26); color: #ffffff; font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;\" style-hover=\"border-color: #ffffff; background: rgba(255,255,255,.07);\">\n            Ver a linha\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 10px 32px; justify-content: space-between; align-items: center; max-width: 1500px; margin: 0 auto; width: 100%; padding-top: 26px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.42);\">\n      <span>Desenvolvido por Francisco Domene<\u002Fspan>\n      <span>Fabricado no Brasil<\u002Fspan>\n      <span style=\"color: #FF7A2F;\">Apenas 150 unidades<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"position: relative; overflow: hidden; border-top: 1px solid rgba(255,255,255,.12); border-bottom: 1px solid rgba(255,255,255,.12); background: rgba(9,9,11,.92); padding: 16px 0;\">\n    <div style=\"display: flex; width: max-content; gap: 60px; animation: marq 26s linear infinite; font-family: 'JetBrains Mono', monospace; font-size: clamp(11px, 1.4vw, 14px); letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.5);\">\n      <sc-for list=\"{{ marquee }}\" as=\"w\" hint-placeholder-count=\"12\">\n        <span style=\"display: inline-flex; align-items: center; gap: 60px; white-space: nowrap;\">{{ w.text }}<span style=\"color: #FF7A2F;\">◆<\u002Fspan><\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section style=\"position: relative; padding: clamp(90px, 15vh, 180px) clamp(16px, 4vw, 64px);\">\n    <div style=\"max-width: 1500px; margin: 0 auto; display: grid; gap: clamp(40px, 7vw, 100px); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start;\">\n      <div style=\"display: grid; gap: 20px; align-content: start; position: sticky; top: 120px;\">\n        <span class=\"rv\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #22DFFF;\">01 / Manifesto<\u002Fspan>\n        <h2 class=\"rv\" style=\"margin: 0; font-size: clamp(34px, 5.6vw, 82px); line-height: .92; font-weight: 900; letter-spacing: -.042em; text-transform: uppercase;\">Qualidade<br>nunca deveria<br>ser privilégio<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 30px;\">\n        <p class=\"rv\" style=\"margin: 0; font-size: clamp(18px, 2.1vw, 26px); line-height: 1.42; font-weight: 500; color: #ffffff; text-wrap: pretty;\">Existe uma barreira antiga no mercado de pratos: a ideia de que som profissional precisa custar caro.<\u002Fp>\n        <p class=\"rv\" style=\"margin: 0; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.66; color: rgba(255,255,255,.62); text-wrap: pretty;\">A Spectrum nasceu para quebrar isso. Mesma essência, mesmo cuidado, mesmo DNA sonoro da Domene Cymbals — em um formato mais acessível graças a um novo modelo de comercialização.<\u002Fp>\n        <p class=\"rv\" style=\"margin: 0; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.66; color: rgba(255,255,255,.62); text-wrap: pretty;\">Não é uma linha de entrada. É uma linha criada para democratizar o acesso a um grande instrumento — porque nada existe sozinho, e tudo começa com uma onda.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position: relative; padding: clamp(50px, 8vh, 90px) clamp(16px, 4vw, 64px) clamp(80px, 12vh, 140px);\">\n    <div style=\"max-width: 1500px; margin: 0 auto; display: grid; gap: clamp(26px, 4vw, 44px);\">\n      <div class=\"rv\" style=\"display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.14); padding-bottom: 18px;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.5);\">Três pilares da Spectrum<\u002Fspan>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #22DFFF;\">Acesso · Som · Alcance<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: clamp(20px, 2.6vw, 34px); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));\">\n        <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div class=\"rv\" style=\"position: relative; display: grid; gap: 16px; align-content: start; padding: clamp(28px, 3.4vw, 46px) clamp(24px, 2.8vw, 38px); border: 1px solid rgba(255,255,255,.14); border-top: 3px solid {{ p.color }}; background: rgba(9,9,11,.94); transition: transform .35s, border-color .35s, box-shadow .35s;\" style-hover=\"transform: translateY(-6px); box-shadow: 0 26px 70px rgba(0,0,0,.55);\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: clamp(26px, 3vw, 38px); font-weight: 700; line-height: 1; color: rgba(255,255,255,.14);\">{{ p.n }}<\u002Fspan>\n            <h3 style=\"margin: 0; font-size: clamp(22px, 2.8vw, 34px); font-weight: 900; letter-spacing: -.035em; text-transform: uppercase; color: {{ p.color }};\">{{ p.title }}<\u002Fh3>\n            <p style=\"margin: 0; font-size: clamp(14px, 1.5vw, 17px); line-height: 1.62; color: rgba(255,255,255,.62); text-wrap: pretty;\">{{ p.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position: relative; padding: clamp(80px, 12vh, 150px) clamp(16px, 4vw, 64px);\">\n    <div style=\"max-width: 1500px; margin: 0 auto; display: grid; gap: clamp(32px, 5vw, 72px); grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: center;\">\n      <div class=\"rv\" style=\"position: relative; aspect-ratio: 4 / 5; border: 1px solid rgba(255,255,255,.16); overflow: hidden; background: #0a0a0c;\">\n        <img src=\"1015dbdc-c3ac-43db-8760-8fd633caa048\" alt=\"Francisco Domene avaliando um prato\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 38%; filter: saturate(.9) contrast(1.05);\">\n        <span style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,5,6,0) 40%, rgba(5,5,6,.75) 100%);\"><\u002Fspan>\n        <span style=\"position: absolute; left: 20px; bottom: 24px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.75);\">Francisco Domene<\u002Fspan>\n        <span style=\"position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, #22DFFF, #FF7A2F);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 22px;\">\n        <span class=\"rv\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #FF7A2F;\">02 / Origem<\u002Fspan>\n        <h2 class=\"rv\" style=\"margin: 0; font-size: clamp(32px, 5vw, 72px); line-height: .94; font-weight: 900; letter-spacing: -.042em; text-transform: uppercase;\">Feito pelas<br>mãos do mestre<\u002Fh2>\n        <p class=\"rv\" style=\"margin: 0; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.66; color: rgba(255,255,255,.64); max-width: 50ch; text-wrap: pretty;\">Cada modelo da Spectrum foi desenvolvido por Francisco Domene, reunindo décadas de experiência, pesquisa e feedback de artistas. Inspirada em uma das séries mais vendidas da história, resgata a característica que todo baterista procura: versatilidade real.<\u002Fp>\n        <div class=\"rv\" style=\"display: flex; flex-wrap: wrap; gap: 10px 26px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.45);\">\n          <span>Liga <span style=\"color: #FF7A2F;\">a confirmar<\u002Fspan><\u002Fspan>\n          <span>Projeto de Francisco Domene<\u002Fspan>\n          <span>Made in Brazil<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"linha\" style=\"position: relative; padding: clamp(90px, 15vh, 180px) clamp(16px, 4vw, 64px);\">\n    <div style=\"max-width: 1500px; margin: 0 auto; display: grid; gap: clamp(32px, 5vw, 56px);\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: end; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.14); padding-bottom: 26px;\">\n        <div style=\"display: grid; gap: 16px;\">\n          <span class=\"rv\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #22DFFF;\">03 / A linha<\u002Fspan>\n          <h2 class=\"rv\" style=\"margin: 0; font-size: clamp(34px, 5.6vw, 82px); line-height: .92; font-weight: 900; letter-spacing: -.042em; text-transform: uppercase;\">Quatro peças.<br>Um espectro.<\u002Fh2>\n        <\u002Fdiv>\n        <p class=\"rv\" style=\"margin: 0; max-width: 34ch; font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.56); text-wrap: pretty;\">Pensadas para acompanhar o baterista em qualquer momento da jornada. Tamanhos finais a confirmar.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\">\n        <sc-for list=\"{{ models }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <article class=\"rv\" style=\"display: grid; border: 1px solid rgba(255,255,255,.14); background: rgba(9,9,11,.92); transition: border-color .35s, transform .35s, box-shadow .35s;\" style-hover=\"border-color: rgba(34,223,255,.65); transform: translateY(-6px); box-shadow: 0 24px 60px rgba(0,0,0,.5);\">\n            <div style=\"position: relative; aspect-ratio: 1 / 1; display: grid; place-items: center; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 2px, transparent 2px 13px);\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.45);\">[ foto do prato ]<\u002Fspan>\n              <span style=\"position: absolute; top: 14px; left: 14px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; color: rgba(255,255,255,.3);\">{{ m.n }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; gap: 8px; padding: 22px; border-top: 1px solid rgba(255,255,255,.14);\">\n              <h3 style=\"margin: 0; font-size: clamp(20px, 2.2vw, 26px); font-weight: 900; letter-spacing: -.03em; text-transform: uppercase;\">{{ m.name }}<\u002Fh3>\n              <p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: rgba(255,255,255,.58);\">{{ m.desc }}<\u002Fp>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #22DFFF; padding-top: 6px;\">{{ m.size }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"rv\" style=\"display: flex; flex-wrap: wrap; gap: 18px 30px; align-items: center; justify-content: space-between; padding: clamp(22px, 3vw, 34px); border: 1px dashed rgba(255,255,255,.24); background: rgba(5,5,6,.5);\">\n        <p style=\"margin: 0; font-size: clamp(16px, 1.9vw, 21px); line-height: 1.4; color: rgba(255,255,255,.8); max-width: 46ch; text-wrap: pretty;\">[ player de áudio ] Ouça cada modelo antes de decidir — um sample curto por peça, seco e com ambiente.<\u002Fp>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #FF7A2F;\">aguardando arquivos<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position: relative; padding: clamp(90px, 15vh, 180px) clamp(16px, 4vw, 64px);\">\n    <div style=\"max-width: 1500px; margin: 0 auto; display: grid; gap: clamp(30px, 4vw, 50px);\">\n      <div style=\"display: grid; gap: 18px; max-width: 60ch;\">\n        <span class=\"rv\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #FF7A2F;\">04 / Série limitada<\u002Fspan>\n        <h2 class=\"rv\" style=\"margin: 0; font-size: clamp(34px, 5.6vw, 82px); line-height: .92; font-weight: 900; letter-spacing: -.042em; text-transform: uppercase;\">150 peças<br>numeradas<\u002Fh2>\n        <p class=\"rv\" style=\"margin: 0; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.64; color: rgba(255,255,255,.62); text-wrap: pretty;\">Serão produzidas apenas 150 unidades, cada uma identificada de 001 a 150. É isso: quando a última for entregue, a série se encerra.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rv\" style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: clamp(16px, 3vw, 44px); border-top: 1px solid rgba(255,255,255,.14); padding-top: clamp(22px, 3vw, 34px);\">\n        <span style=\"font-size: clamp(76px, 16vw, 220px); font-weight: 900; letter-spacing: -.06em; line-height: .82; color: #FF7A2F; text-shadow: 0 0 70px rgba(255,122,47,.35);\">150<\u002Fspan>\n        <div style=\"display: grid; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.55);\">\n          <span style=\"color: #ffffff;\">unidades no mundo<\u002Fspan>\n          <span>numeradas de 001 a 150<\u002Fspan>\n          <span>sem reposição<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position: relative; padding: clamp(90px, 15vh, 180px) clamp(16px, 4vw, 64px);\">\n    <div style=\"max-width: 1500px; margin: 0 auto; display: grid; gap: clamp(32px, 5vw, 56px);\">\n      <div style=\"display: grid; gap: 16px; max-width: 60ch;\">\n        <span class=\"rv\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #22DFFF;\">05 / Artistas<\u002Fspan>\n        <h2 class=\"rv\" style=\"margin: 0; font-size: clamp(34px, 5.6vw, 82px); line-height: .92; font-weight: 900; letter-spacing: -.042em; text-transform: uppercase;\">Quem já<br>está tocando<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));\">\n        <sc-for list=\"{{ artists }}\" as=\"a\" hint-placeholder-count=\"3\">\n          <article Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position: relative; padding: clamp(90px, 15vh, 180px) clamp(16px, 4vw, 64px);\">\n    <div style=\"max-width: 1500px; margin: 0 auto; display: grid; gap: clamp(32px, 5vw, 50px);\">\n      <div style=\"display: grid; gap: 16px; max-width: 60ch;\">\n        <span class=\"rv\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #22DFFF;\">06 / Como comprar<\u002Fspan>\n        <h2 class=\"rv\" style=\"margin: 0; font-size: clamp(34px, 5.6vw, 82px); line-height: .92; font-weight: 900; letter-spacing: -.042em; text-transform: uppercase;\">A venda<br>é no grupo<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.14);\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div class=\"rv\" style=\"background: rgba(9,9,11,.94); padding: clamp(24px, 3vw, 40px); display: grid; gap: 12px; align-content: start;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: clamp(28px, 3.4vw, 40px); font-weight: 700; color: rgba(255,255,255,.16); line-height: 1;\">{{ s.n }}<\u002Fspan>\n            <h3 style=\"margin: 0; font-size: clamp(18px, 2vw, 22px); font-weight: 900; text-transform: uppercase; letter-spacing: -.02em;\">{{ s.title }}<\u002Fh3>\n            <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: rgba(255,255,255,.58);\">{{ s.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position: relative; padding: clamp(80px, 12vh, 150px) clamp(16px, 4vw, 64px);\">\n    <div style=\"max-width: 980px; margin: 0 auto; display: grid; gap: clamp(26px, 4vw, 40px);\">\n      <h2 class=\"rv\" style=\"margin: 0; font-size: clamp(28px, 4.2vw, 54px); font-weight: 900; letter-spacing: -.042em; text-transform: uppercase;\">Perguntas frequentes<\u002Fh2>\n      <div style=\"display: grid;\">\n        <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div style=\"border-top: 1px solid rgba(255,255,255,.14);\">\n            <button type=\"button\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"width: 100%; min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 0; background: transparent; border: 0; color: #ffffff; font-family: Archivo, sans-serif; font-size: clamp(16px, 2vw, 20px); font-weight: 600; text-align: left; cursor: pointer;\" style-hover=\"color: #22DFFF;\">\n              {{ f.q }}\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #22DFFF; flex: none;\">{{ f.sign }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin: 0; padding: 0 0 24px; max-width: 68ch; font-size: 16px; line-height: 1.64; color: rgba(255,255,255,.62); text-wrap: pretty;\">{{ f.a }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position: relative; padding: clamp(100px, 18vh, 210px) clamp(16px, 4vw, 64px); text-align: center;\">\n    <div style=\"position: relative; display: grid; justify-items: center; gap: 28px; max-width: 1000px; margin: 0 auto;\">\n      <img src=\"1bb05489-d2aa-461a-951c-c776e26f1e14\" alt=\"Spectrum\" style=\"width: clamp(210px, 30vw, 340px); height: auto; display: block;\">\n      <h2 style=\"margin: 0; font-size: clamp(40px, 9vw, 130px); line-height: .86; font-weight: 900; letter-spacing: -.05em; text-transform: uppercase;\">Música<br>para todos<\u002Fh2>\n      <p style=\"margin: 0; max-width: 50ch; font-size: clamp(15px, 1.8vw, 19px); line-height: 1.56; color: rgba(255,255,255,.66); text-wrap: pretty;\">Toda jornada começa com um primeiro som. Entre no grupo e esteja entre os 150 primeiros a tocar uma Spectrum.<\u002Fp>\n      <a href=\"{{ whatsappUrl }}\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 62px; padding: 0 42px; border-radius: 4px; background: #FF7A2F; color: #050506; font-size: 15px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; transition: box-shadow .3s, transform .3s;\" style-hover=\"box-shadow: 0 0 56px rgba(255,122,47,.5); transform: translateY(-2px);\">\n        Entrar no grupo do WhatsApp\n      <\u002Fa>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.42);\">Série de lançamento · apenas 150 unidades<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding: 40px clamp(16px, 4vw, 64px) 118px; border-top: 1px solid rgba(255,255,255,.12); display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: center; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.36);\">\n    <span>© Domene Cymbals — Linha Spectrum 2026<\u002Fspan>\n    <span>@domenecymbals<\u002Fspan>\n  <\u002Ffooter>\n\n  <div style=\"position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; padding: 12px clamp(16px, 4vw, 64px) calc(12px + env(safe-area-inset-bottom)); background: rgba(6,6,8,.97); border-top: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n    <div style=\"display: grid; gap: 2px; min-width: 0;\">\n      <span style=\"font-size: 14px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">Domene Spectrum<\u002Fspan>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #FF7A2F;\">Apenas 150 unidades<\u002Fspan>\n    <\u002Fdiv>\n    <a href=\"{{ whatsappUrl }}\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 24px; border-radius: 4px; background: #22DFFF; color: #050506; font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; flex: none;\" style-hover=\"background: #ffffff;\">\n      Entrar no grupo\n    <\u002Fa>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;whatsappUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conversão&quot;},&quot;waveIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.4,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Fundo&quot;}}\">\nclass Component extends DCLogic {\n  state = { openFaq: 0 };\n\n  componentDidMount() {\n    const io = new IntersectionObserver((es) => {\n      es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    document.querySelectorAll('.rv').forEach((el, i) => {\n      el.style.transitionDelay = (i % 4) * 80 + 'ms';\n      io.observe(el);\n    });\n    document.querySelectorAll('.clip').forEach((el, i) => {\n      el.style.transitionDelay = i * 110 + 'ms';\n      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));\n    });\n    this._io = io;\n    this.startWaves();\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._onVis) document.removeEventListener('visibilitychange', this._onVis);\n  }\n\n  startWaves() {\n    const cv = this._canvas;\n    if (!cv) return;\n    const ctx = cv.getContext('2d', { alpha: true, desynchronized: true });\n    const intensity = this.props.waveIntensity ?? 1;\n    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n    // Render at ~half resolution and let a CSS blur supply the glow — far cheaper\n    // than per-stroke shadowBlur, which is what made scrolling stutter.\n    const SCALE = 0.5;\n    let w = 0, h = 0;\n\n    const resize = () => {\n      w = Math.max(1, Math.round(cv.clientWidth * SCALE));\n      h = Math.max(1, Math.round(cv.clientHeight * SCALE));\n      cv.width = w; cv.height = h;\n      needsDraw = true;\n    };\n\n    let scrollY = window.scrollY;\n    let needsDraw = true;\n    this._onScroll = () => { scrollY = window.scrollY; };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n\n    let resizeTimer = 0;\n    this._onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); };\n    window.addEventListener('resize', this._onResize);\n    resize();\n\n    const narrow = window.innerWidth < 760;\n    const LINES = narrow ? 12 : 18;\n    const lines = [];\n    for (let i = 0; i < LINES; i++) {\n      const t = LINES === 1 ? 0.5 : i / (LINES - 1);\n      lines.push({\n        t,\n        color: t < 0.34 ? '#22DFFF' : t < 0.5 ? '#7FE6FF' : t < 0.72 ? '#FF7A2F' : '#22DFFF',\n        amp: 0.06 + 0.16 * Math.sin(t * Math.PI),\n        freq: 0.9 + t * 1.7,\n        speed: 0.16 + t * 0.34,\n        phase: t * Math.PI * 2.4,\n        alpha: (0.16 + 0.44 * Math.sin(t * Math.PI)) * intensity\n      });\n    }\n\n    let hidden = document.hidden;\n    this._onVis = () => { hidden = document.hidden; };\n    document.addEventListener('visibilitychange', this._onVis);\n\n    const FRAME = 1000 / 30;\n    let last = -1e9;\n\n    const draw = (ms) => {\n      this._raf = requestAnimationFrame(draw);\n      if (hidden) return;\n      if (!needsDraw && ms - last < FRAME) return;\n      last = ms; needsDraw = false;\n\n      const time = reduced ? 0 : ms / 1000;\n      ctx.clearRect(0, 0, w, h);\n      ctx.globalCompositeOperation = 'lighter';\n      ctx.lineCap = 'round';\n      ctx.lineWidth = 1.4;\n      const drift = scrollY * 0.0012;\n      const centerY = h * 0.52;\n      const SEG = 26;\n      const step = (w + 2 * (w / SEG)) / (SEG + 2);\n      const px = [], py = [];\n\n      for (let li = 0; li < lines.length; li++) {\n        const L = lines[li];\n        const baseY = centerY + (L.t - 0.5) * h * 0.92;\n        px.length = 0; py.length = 0;\n        for (let i = -1; i <= SEG + 1; i++) {\n          const x = i * step - step;\n          const u = x / w;\n          const uc = u < 0 ? 0 : u > 1 ? 1 : u;\n          const env = Math.sin(uc * Math.PI);\n          px.push(x);\n          py.push(baseY\n            + Math.sin(u * Math.PI * L.freq * 2 + time * L.speed * 2 + L.phase + drift) * h * L.amp * env\n            + Math.sin(u * Math.PI * L.freq * 5.3 - time * L.speed * 1.3 + L.phase) * h * L.amp * 0.28 * env);\n        }\n        ctx.beginPath();\n        ctx.strokeStyle = L.color;\n        ctx.globalAlpha = L.alpha;\n        ctx.moveTo(px[0], py[0]);\n        for (let i = 1; i < px.length - 1; i++) {\n          ctx.quadraticCurveTo(px[i], py[i], (px[i] + px[i + 1]) / 2, (py[i] + py[i + 1]) / 2);\n        }\n        ctx.stroke();\n      }\n      ctx.globalAlpha = 1;\n      ctx.globalCompositeOperation = 'source-over';\n    };\n    this._raf = requestAnimationFrame(draw);\n  }\n\n  renderVals() {\n\n    const faqData = [\n      { q: 'A Spectrum é uma linha de entrada?', a: 'Não. É uma linha desenvolvida pelo mestre Francisco Domene com o mesmo DNA sonoro da Domene Cymbals, criada para democratizar o acesso — não para baratear o produto.' },\n      { q: 'Por que ela custa menos que as outras linhas Domene?', a: 'Pelo modelo de comercialização. A Spectrum opera com estoque enxuto e venda direta, o que reduz custos de distribuição sem mexer no que importa: o som.' },\n      { q: 'Serve para qual estilo musical?', a: 'Para todos. A versatilidade foi o critério central do projeto — a linha responde bem do gospel ao rock, do estúdio ao palco de bar.' },\n      { q: 'Por que só 150 unidades?', a: 'A Spectrum é uma série limitada: serão produzidas apenas 150 peças, numeradas de 001 a 150. Não haverá reposição.' },\n      { q: 'Como faço para comprar?', a: 'A venda acontece exclusivamente no grupo de WhatsApp. Preço, modelos e horário de abertura são divulgados lá primeiro, por ordem de chegada.' }\n    ];\n\n    const words = ['Uma nova onda está chegando', '150 unidades numeradas', 'Fabricado no Brasil', 'Música para todos', 'Domene Spectrum 2026', 'A venda é no grupo'];\n\n    return {\n      whatsappUrl: this.props.whatsappUrl ?? '#',\n      waveRef: (el) => { this._canvas = el; },\n      marquee: words.concat(words).map((text, i) => ({ i, text })),\n      faqs: faqData.map((f, i) => ({\n        q: f.q, a: f.a,\n        open: this.state.openFaq === i,\n        sign: this.state.openFaq === i ? '–' : '+',\n        toggle: () => this.setState((s) => ({ openFaq: s.openFaq === i ? -1 : i }))\n      })),\n      steps: [\n        { n: '01', title: 'Entre no grupo', body: 'Um clique e você está dentro. Sem cadastro, sem burocracia.' },\n        { n: '02', title: 'Receba o aviso', body: 'Preço, modelos e abertura das vendas são anunciados primeiro lá dentro.' },\n        { n: '03', title: 'Garanta a sua', body: 'São 150 peças por ordem de chegada. Quem está no grupo compra primeiro.' }\n      ],\n      pillars: [\n        { n: '01', title: 'Acessibilidade', color: '#22DFFF', body: 'Preço próximo ao dos importados de entrada, com origem e assinatura brasileiras.' },\n        { n: '02', title: 'Qualidade', color: '#ffffff
